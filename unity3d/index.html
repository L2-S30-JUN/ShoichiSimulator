<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>UnityProject</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000
    }

    /* iframe(또는 창) 전체를 채운다 — 부모가 크기를 정하고 캔버스는 100%로 따라간다.
       Unity 로더의 matchWebGLToCanvasSize(기본 true)가 CSS 크기에 맞춰 프레임버퍼를 조정한다. */
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b0b0c;
      /* 게임이 자체 커서를 그리므로 OS 커서는 캔버스 위에서 숨긴다 (v1.7 canvas{cursor:none}과 동일) */
      cursor: none
    }

    #boot {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #000;
      color: #b5aeaa;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .5px
    }

    #boot.done {
      display: none
    }

    #boot .bar {
      width: 260px;
      height: 3px;
      background: #2a2624;
      border-radius: 2px;
      overflow: hidden
    }

    #boot .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #c1372c;
      transition: width .15s
    }

    #boot .err {
      color: #e06a5e;
      max-width: 70%;
      text-align: center;
      white-space: pre-wrap
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="boot">
    <div>쇼이치 시뮬레이터 3D 불러오는 중…</div>
    <div class="bar"><i id="boot-bar"></i></div>
    <div id="boot-msg"></div>
  </div>

  <script src="Build/unity3d.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var boot = document.querySelector("#boot");
    var bootBar = document.querySelector("#boot-bar");
    var bootMsg = document.querySelector("#boot-msg");

    // 우클릭 이동이 핵심 조작이라 브라우저 컨텍스트 메뉴를 반드시 막는다.
    // (Unity WebGL 로더는 이걸 대신 해주지 않는다 — 안 막으면 이동 자체가 불가능)
    window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    // 마우스4·5(뒤로/앞으로)로 히스토리가 이동해버리는 것도 차단
    window.addEventListener("mousedown", function (e) { if (e.button === 3 || e.button === 4) e.preventDefault(); });

    // iframe 안에서 Esc → 부모에게 로비 복귀 요청 (부모는 이 메시지를 받아 iframe을 언로드한다)
    window.addEventListener("keydown", function (e) {
      if (e.code === "Escape" && window.parent !== window) {
        window.parent.postMessage({ type: "shoichi3d-exit" }, "*");
      }
    });

    createUnityInstance(canvas, {
      dataUrl: "Build/unity3d.data.unityweb",
      frameworkUrl: "Build/unity3d.framework.js.unityweb",
      codeUrl: "Build/unity3d.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "UnityProject",
      productVersion: "1.0",
      // 1로 고정: 카메라 각도·줌·단검 크기가 1920×1080 CSS 픽셀 기준으로 맞춰져 있다.
      // DPR을 따라가면 고DPI 화면에서 Screen.height가 달라져 화면 배율이 원작과 어긋난다
      // (2D v1.7도 CSS 픽셀 기준이라 이쪽이 두 버전 간에도 일관적이다).
      devicePixelRatio: 1,
    }, function (p) {
      bootBar.style.width = (p * 100) + "%";
    }).then(function (instance) {
      window.unityInstance = instance;   // 부모에서 SendMessage로 설정값을 넘길 때 사용
      boot.classList.add("done");
      canvas.focus();

      // 커서가 캔버스를 벗어나면 브라우저는 마지막 좌표를 유지한다. 그 좌표가 화면 가장자리면
      // 카메라 엣지 스크롤이 무한히 흘러가므로, 벗어난 사실을 게임에 알려 멈추게 한다.
      // (윈도우 빌드는 CursorLockMode.Confined로 커서를 창에 가둬서 애초에 생기지 않는 문제)
      canvas.addEventListener("mouseenter", function () { instance.SendMessage("ShoichiDebugView", "OnPointerOverCanvas", "1"); });
      canvas.addEventListener("mouseleave", function () { instance.SendMessage("ShoichiDebugView", "OnPointerOverCanvas", "0"); });
      if (window.parent !== window) window.parent.postMessage({ type: "shoichi3d-ready" }, "*");
    }).catch(function (err) {
      bootMsg.className = "err";
      bootMsg.textContent = "로드 실패: " + err +
        "\n\nfile:// 로 열면 wasm이 CORS에 막힙니다. 로컬 서버로 여세요:\npython -m http.server 8000";
    });

    // 캔버스에서 포커스가 빠지면 키 입력이 죽는다 — 클릭할 때마다 되돌린다
    canvas.addEventListener("mousedown", function () { canvas.focus(); });
  </script>
</body>

</html>
